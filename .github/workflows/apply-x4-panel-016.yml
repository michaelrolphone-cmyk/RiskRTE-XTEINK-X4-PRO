name: Apply X4 panel 0.1.16 absolute drive

on:
  push:
    branches:
      - recovery/x4-sd-state-0214-20261010
    paths:
      - .github/workflows/apply-x4-panel-016.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/x4-sd-state-0214-20261010
          fetch-depth: 0

      - name: Restore 0.1.13 and lengthen the coherent absolute pulse
        shell: bash
        run: |
          set -euo pipefail
          # Retry after validating the complete 0.1.13 assertion inventory.
          python3 minimal/scripts/apply_x4_panel_016.py
          rm minimal/scripts/apply_x4_panel_016.py .github/workflows/apply-x4-panel-016.yml
          git diff --check
          python3 -m json.tool minimal/drivers/x4pro_uc8279_fast/manifest.json >/dev/null
          python3 -m json.tool minimal/validation/uc8279-absolute4-0.1.16.json >/dev/null
          grep -q '#define X4PRO_STRONG_MOTION_FRAMES 4u' minimal/drivers/x4pro_uc8279_fast/driver.c
          grep -q '#define X4PRO_BROAD_MOTION_FRAMES 2u' minimal/drivers/x4pro_uc8279_fast/driver.c
          grep -q '"version": "0.1.16"' minimal/drivers/x4pro_uc8279_fast/manifest.json
          ! grep -q 'directional_overdrive' minimal/drivers/x4pro_uc8279_fast/driver.c

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(x4): lengthen absolute active drive to four frames'
          git push origin HEAD:recovery/x4-sd-state-0214-20261010
