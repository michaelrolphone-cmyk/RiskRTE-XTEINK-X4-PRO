name: Apply X4 UC8279 panel 0.1.13

on:
  push:
    branches:
      - 'recovery/x4-sd-state-0214-20261010'
    paths:
      - '.github/workflows/apply-x4-panel-013.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/x4-sd-state-0214-20261010
          fetch-depth: 0

      - name: Install panel 0.1.13 source and tests
        shell: bash
        run: |
          set -euo pipefail
          cat .github/x4-panel-013-payload/part-* | base64 -d > /tmp/x4-panel-013-changed-files.tar.gz
          echo 'd174a123595dcc3945b7d4ab4e0ac3243f98b7e8dcd137aee0274a9fba820b0c  /tmp/x4-panel-013-changed-files.tar.gz' | sha256sum -c -
          tar -xzf /tmp/x4-panel-013-changed-files.tar.gz
          python3 -m json.tool minimal/drivers/x4pro_uc8279_fast/manifest.json >/dev/null
          python3 -m json.tool minimal/validation/uc8279-changed-window-strong-motion-0.1.13.json >/dev/null
          test "$(python3 -c 'import json; print(json.load(open("minimal/drivers/x4pro_uc8279_fast/manifest.json"))["version"])')" = '0.1.13'
          grep -q '#define X4PRO_STRONG_MOTION_FRAMES 2u' minimal/drivers/x4pro_uc8279_fast/driver.c
          grep -q 'static bool changed_area' minimal/drivers/x4pro_uc8279_fast/driver.c
          rm -rf .github/x4-panel-013-payload .github/workflows/apply-x4-panel-013.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(x4): drive fewer UC8279 pixels more strongly'
          git push origin HEAD:recovery/x4-sd-state-0214-20261010
