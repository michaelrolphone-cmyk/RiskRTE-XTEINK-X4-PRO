name: Finalize X4 panel 0.1.13 source

on:
  push:
    branches:
      - recovery/x4-sd-state-0214-20261010
    paths:
      - .github/x4-panel-013/**
      - .github/workflows/apply-x4-panel-013.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/x4-sd-state-0214-20261010
          fetch-depth: 0
      - name: Materialize panel 0.1.13 source
        run: |
          mkdir -p "$RUNNER_TEMP/x4-panel-013"
          cat .github/x4-panel-013/payload.part.* > "$RUNNER_TEMP/x4-panel-013/payload.b64"
          echo 'f9cc77435cc0e407952b6fe0310890286267fef108f4fd2ed01320b08e993707  '"$RUNNER_TEMP/x4-panel-013/payload.b64" | sha256sum -c -
          base64 -d "$RUNNER_TEMP/x4-panel-013/payload.b64" | tar -xz -C "$RUNNER_TEMP/x4-panel-013"
          cp "$RUNNER_TEMP/x4-panel-013/driver.c" minimal/drivers/x4pro_uc8279_fast/driver.c
          cp "$RUNNER_TEMP/x4-panel-013/manifest.json" minimal/drivers/x4pro_uc8279_fast/manifest.json
          cp "$RUNNER_TEMP/x4-panel-013/validation.json" minimal/validation/uc8279-delta-multipulse-0.1.13.json
      - name: Align tests and documentation
        run: python3 .github/x4-panel-013/apply-fixed.py
      - name: Verify candidate identity
        run: |
          echo 'e70f37ee8b2158350c4ab3c43ef9d3a22c71e80c6a3d17a47cabca08c4236629  minimal/drivers/x4pro_uc8279_fast/driver.c' | sha256sum -c -
          echo '34224397956b34063a0381927b808a4623a4d81ee20dd6266f27fdcc6b46161e  minimal/drivers/x4pro_uc8279_fast/manifest.json' | sha256sum -c -
          grep -q 'fast_lut_frames = 2u' minimal/drivers/x4pro_uc8279_fast/driver.c
          grep -q 'changed_bounds' minimal/drivers/x4pro_uc8279_fast/driver.c
          grep -q '"version": "0.1.13"' minimal/drivers/x4pro_uc8279_fast/manifest.json
          grep -q 'm.effective_update.width==96' minimal/test/uc8279_fast_test.c
          grep -q 'bytes_sent==12\*h' minimal/test/uc8279_fast_test.c
          python3 -m py_compile .github/x4-panel-013/apply-fixed.py
          git diff --check
      - name: Commit finalized source
        run: |
          rm -rf .github/x4-panel-013 .github/workflows/apply-x4-panel-013.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(x4): drive delta windows with two A2 pulses'
          git push origin HEAD:recovery/x4-sd-state-0214-20261010
