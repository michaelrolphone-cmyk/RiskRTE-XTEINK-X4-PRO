name: Apply UC8279 fast-driver 0.1.9
on:
  push:
    branches: [integrate/x4-resident-loader-repair-046]
    paths: ['.github/workflows/x4-uc8279-019-apply.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate/x4-resident-loader-repair-046
          fetch-depth: 0
      - name: Apply reviewed source and regression update
        shell: bash
        run: |
          cat <<'PATCH_B64' | base64 -d | gzip -d > minimal/scripts/apply_uc8279_019_upgrade.py
          
          PATCH_B64
          python3 minimal/scripts/apply_uc8279_019_upgrade.py
          rm -f minimal/scripts/apply_uc8279_019_upgrade.py .github/workflows/x4-uc8279-019-apply.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(x4): add plane-coherent UC8279 fast driver 0.1.9'
          git push origin HEAD:integrate/x4-resident-loader-repair-046
