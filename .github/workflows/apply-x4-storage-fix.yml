name: Apply tested X4 storage and display repair
on:
  push:
    branches: [integrate/x4-resident-loader-repair-046]
    paths: ['.delivery/x4-storage-display.patch', '.github/workflows/apply-x4-storage-fix.yml']
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'michaelrolphone-cmyk/RiskRTE-XTEINK-X4-PRO'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: aaa77ad11fc66b42430254ab7065590d33fd1fca
          path: .shared/runtime
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/T5S3-Reader
          ref: 29276b4e1cff7819af065a77cf64805f6d5a12ce
          path: .shared/reader
          persist-credentials: false
      - name: Apply verified driver and composition changes
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/integrate/x4-resident-loader-repair-046 | cut -f1)" = "$GITHUB_SHA"
          git apply --check .delivery/x4-storage-display.patch
          git apply .delivery/x4-storage-display.patch
          git diff --check
      - name: Actual production driver regressions, normal and sanitized
        env:
          RISCRTE_RUNTIME_ROOT: ${{ github.workspace }}/.shared/runtime
          RISCRTE_READER_ROOT: ${{ github.workspace }}/.shared/reader
        run: |
          set -euo pipefail
          for mode in 0 1; do
            SANITIZE=$mode bash minimal/test/run_uc8279_fast_test.sh
            SANITIZE=$mode bash minimal/test/run_sd_test.sh
          done
          python3 minimal/test/native_composition_test.py
      - name: Commit tested fixes on the existing integration branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minimal/
          git rm .delivery/x4-storage-display.patch
          git commit -m 'fix(x4): hardware SDMMC storage and delayed-poll fast-display repair'
          git push origin HEAD:refs/heads/integrate/x4-resident-loader-repair-046
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install platformio==6.1.19 pyelftools==0.32
      - name: Build updated ELF drivers with the fast panel
        run: |
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
          python minimal/scripts/build_drivers.py --runtime .shared/runtime --reader .shared/reader --source-lock minimal/test/ordinary-driver-sources.lock.json --cc "$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc" --output build/minimal-fast-drivers --sleep --panel-driver uc8279-fast
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x4-sdmmc-fast-display-drivers-${{ github.sha }}
          path: build/minimal-fast-drivers/
          if-no-files-found: ignore
