name: Apply X4 panel 0.1.17 from 0.1.12

on:
  push:
    branches:
      - experiment/x4-panel-012-strong-drive-017
    paths:
      - .github/workflows/apply-x4-panel-017.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/x4-panel-012-strong-drive-017
          fetch-depth: 0
      - name: Apply bounded three-pass absolute profile
        shell: bash
        run: |
          set -euo pipefail
          test "$(python3 -c 'import json; print(json.load(open("minimal/drivers/x4pro_uc8279_fast/manifest.json"))["version"])')" = '0.1.12'
          python3 - <<'PY'
          from pathlib import Path
          path = Path('minimal/scripts/apply_x4_panel_017.py')
          text = path.read_text()
          old = 'readme.write_text(text + section)'
          new = 'readme.write_text((text + section).rstrip() + "\\n")'
          if text.count(old) != 1:
              raise SystemExit('README write site missing')
          path.write_text(text.replace(old, new, 1))
          PY
          python3 minimal/scripts/apply_x4_panel_017.py
          rm minimal/scripts/apply_x4_panel_017.py .github/workflows/apply-x4-panel-017.yml
          git diff --check
          python3 -m json.tool minimal/drivers/x4pro_uc8279_fast/manifest.json >/dev/null
          python3 -m json.tool minimal/validation/uc8279-012-three-pass-0.1.17.json >/dev/null
          grep -q '#define X4PRO_ACTIVE_LOCAL_FRAMES 3u' minimal/drivers/x4pro_uc8279_fast/driver.c
          grep -q '#define X4PRO_ACTIVE_BROAD_FRAMES 2u' minimal/drivers/x4pro_uc8279_fast/driver.c
          grep -q 'settle_stage = SETTLE_WAIT' minimal/drivers/x4pro_uc8279_fast/driver.c
          grep -q '"version": "0.1.17"' minimal/drivers/x4pro_uc8279_fast/manifest.json
          ! grep -q 'directional_overdrive' minimal/drivers/x4pro_uc8279_fast/driver.c
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(x4): test bounded three-pass drive on panel 0.1.12'
          git push origin HEAD:experiment/x4-panel-012-strong-drive-017
