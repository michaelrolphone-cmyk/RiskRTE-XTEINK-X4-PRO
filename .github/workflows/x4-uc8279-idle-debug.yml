name: Apply UC8279 differential OLD-sync repair
on:
  push:
    branches: [integrate/x4-resident-loader-repair-046]
    paths: ['.github/workflows/x4-uc8279-idle-debug.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate/x4-resident-loader-repair-046
          fetch-depth: 0
      - name: Remove duplicate DTM1 command
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("minimal/drivers/x4pro_uc8279_fast/driver.c"); t=p.read_text(); a="                sync_full = settle_update;\n                if (!begin_plane(0x10)) goto failed;\n                async_stage = UC_ASYNC_SYNC;\n            }\n            /* Full-stride OLD sync must run outside the partial RAM window. */\n            if (quality_partial) command(0x92);\n            if (!begin_plane(0x10)) goto failed;\n            async_stage = UC_ASYNC_SYNC;\n"; b="                sync_full = settle_update;\n                if (!begin_plane(0x10)) goto failed;\n                async_stage = UC_ASYNC_SYNC;\n            } else {\n                /* Full-stride OLD sync must run outside the partial RAM window. */\n                if (quality_partial) command(0x92);\n                if (!begin_plane(0x10)) goto failed;\n                async_stage = UC_ASYNC_SYNC;\n            }\n"; assert t.count(a)==1; p.write_text(t.replace(a,b))'
          rm .github/workflows/x4-uc8279-idle-debug.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(x4): avoid duplicate UC8279 DTM1 sync command'
          git push origin HEAD:integrate/x4-resident-loader-repair-046
