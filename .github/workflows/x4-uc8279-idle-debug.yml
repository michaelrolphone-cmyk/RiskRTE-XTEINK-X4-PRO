name: Apply UC8279 differential OLD-sync repair
on:
  push:
    branches: [integrate/x4-resident-loader-repair-046]
    paths: ['.github/workflows/x4-uc8279-idle-debug.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate/x4-resident-loader-repair-046
          fetch-depth: 0
      - name: Remove duplicate DTM1 command and diagnostic workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('minimal/drivers/x4pro_uc8279_fast/driver.c')
          text = path.read_text()
          before = '''                sync_full = settle_update;
                if (!begin_plane(0x10)) goto failed;
                async_stage = UC_ASYNC_SYNC;
            }
            /* Full-stride OLD sync must run outside the partial RAM window. */
            if (quality_partial) command(0x92);
            if (!begin_plane(0x10)) goto failed;
            async_stage = UC_ASYNC_SYNC;
'''
          after = '''                sync_full = settle_update;
                if (!begin_plane(0x10)) goto failed;
                async_stage = UC_ASYNC_SYNC;
            } else {
                /* Full-stride OLD sync must run outside the partial RAM window. */
                if (quality_partial) command(0x92);
                if (!begin_plane(0x10)) goto failed;
                async_stage = UC_ASYNC_SYNC;
            }
'''
          if text.count(before) != 1:
              raise SystemExit('expected UC8279 sync fallthrough block not found exactly once')
          path.write_text(text.replace(before, after))
          PY
          rm .github/workflows/x4-uc8279-idle-debug.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(x4): avoid duplicate UC8279 DTM1 sync command'
          git push origin HEAD:integrate/x4-resident-loader-repair-046
