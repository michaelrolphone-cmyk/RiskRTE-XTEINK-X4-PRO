name: Apply X4 panel 0.1.15 mode-1 waveform

on:
  push:
    branches:
      - recovery/x4-sd-state-0214-20261010
    paths:
      - .github/workflows/apply-x4-panel-015.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/x4-sd-state-0214-20261010
          fetch-depth: 0

      - name: Adopt laboratory mode 1 in the firmware driver
        shell: bash
        run: |
          set -euo pipefail
          python3 minimal/scripts/apply_x4_panel_015.py
          rm minimal/scripts/apply_x4_panel_015.py
          git diff --check
          python3 -m json.tool minimal/drivers/x4pro_uc8279_fast/manifest.json >/dev/null
          python3 -m json.tool minimal/validation/uc8279-mode1-2plus2-0.1.15.json >/dev/null
          grep -q '#define X4PRO_DIRECTIONAL_PHASE_FRAMES 2u' minimal/drivers/x4pro_uc8279_fast/driver.c
          grep -q 'X4PRO_DIRECTIONAL_POWER_VDH 0x3Au' minimal/drivers/x4pro_uc8279_fast/driver.c
          grep -q '"version": "0.1.15"' minimal/drivers/x4pro_uc8279_fast/manifest.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(x4): adopt lab mode 1 2+2 waveform'
          git push origin HEAD:recovery/x4-sd-state-0214-20261010
