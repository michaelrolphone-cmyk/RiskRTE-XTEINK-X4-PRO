name: Typed minimal X4 drivers
on: [push, pull_request, workflow_dispatch]
env:
  PLATFORMIO_SETTING_ENABLE_TELEMETRY: "No"
jobs:
  host-target:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 3c39aa7ac50ecd7f6da0296a62a2d7af066f82d1
          path: .shared/runtime
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/T5S3-Reader
          ref: aac8c06d3221139084acd0cfc64f7b0ba194a97a
          path: .shared/reader
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: 3702b9a594196bb5cb546732a5d4aa668c88ff91
          path: .shared/apps
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install platformio==6.1.19 pyelftools==0.32
      - name: Host lifecycle and wire simulations
        env:
          RISCRTE_RUNTIME_ROOT: ${{ github.workspace }}/.shared/runtime
          RISCRTE_READER_ROOT: ${{ github.workspace }}/.shared/reader
          RISCRTE_APPS_ROOT: ${{ github.workspace }}/.shared/apps
          SANITIZE: '1'
        run: |
          bash .shared/reader/test/run_display_power_contract_test.sh
          bash .shared/reader/test/run_touch_power_test.sh
          bash .shared/reader/test/storage_volume/run_sleep_extension_test.sh
          python3 minimal/test/prepare_sdk_test.py
          python3 minimal/test/bundle_identity_test.py
          python3 minimal/test/app_bundle_grants_test.py
          python3 minimal/test/settings_power_profile_test.py
          python3 minimal/test/provisioning_profile_test.py
          bash minimal/test/run_native_gpio_readback_test.sh
          bash minimal/test/run_frontlight_cpu_port_test.sh
          for driver in board_power i2c panel frontlight buttons rtc sd battery gt911; do
            bash minimal/test/run_${driver}_test.sh
          done
          bash minimal/test/run_power_test.sh
          bash minimal/test/run_power_navigation_test.sh
          bash minimal/test/run_clock_sleep_test.sh
          python3 minimal/test/sleep_profile_test.py
          bash minimal/test/run_profile_test.sh
      - name: Install pinned target compiler
        run: pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Build and validate ordinary Xtensa providers
        run: >-
          python3 minimal/scripts/build_drivers.py
          --runtime .shared/runtime --reader .shared/reader
          --cc "$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc"
          --output build/minimal-drivers --sleep
      - uses: actions/upload-artifact@v4
        with:
          name: x4-typed-drivers-${{ github.sha }}
          path: build/minimal-drivers
