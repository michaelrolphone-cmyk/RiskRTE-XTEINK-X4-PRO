name: X4 SDMMC integration
on:
  push:
    branches: [integrate/x4-resident-loader-repair-046]
    paths: ['.github/workflows/x4-sdmmc-integration.yml', 'minimal/integration/sdmmc/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  integration-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: x4-native-integration-tools-9ceeb8333fa637343a7c9675e0d951d017e6da66
          run-id: 38006463248
          github-token: ${{ github.token }}
          path: prepared
      - name: Export remaining pinned ULP compiler
        run: |
          mkdir -p .integration output
          tar -xzf prepared/x4-native-integration-tools.tar.gz -C .integration ./platformio/packages/toolchain-riscv32-esp
          tar -czf output/ulp-compiler.tar.gz -C .integration platformio/packages/toolchain-riscv32-esp
          sha256sum output/* > output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: x4-integration-ulp-${{ github.sha }}
          path: output/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
