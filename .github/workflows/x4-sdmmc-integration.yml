name: X4 SDMMC integration
on:
  push:
    branches: [integrate/x4-resident-loader-repair-046]
    paths: ['.github/workflows/x4-sdmmc-integration.yml', 'minimal/integration/sdmmc/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  integration-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: x4-native-integration-tools-9ceeb8333fa637343a7c9675e0d951d017e6da66
          run-id: 38006463248
          github-token: ${{ github.token }}
          path: prepared
      - name: Retain the pinned compiler, SDK and source only
        run: |
          mkdir -p .integration output
          tar -xzf prepared/x4-native-integration-tools.tar.gz -C .integration
          rm -rf prepared .integration/platformio/.cache
          python3 - <<'PY'
          import pathlib, shutil
          sdk=pathlib.Path('.integration/platformio/packages/framework-arduinoespressif32/tools/sdk')
          for item in sdk.iterdir():
              if item.is_dir() and item.name != 'esp32s3': shutil.rmtree(item)
          for item in pathlib.Path('.integration').rglob('__pycache__'): shutil.rmtree(item)
          PY
          tar -czf output/sources.tar.gz -C .integration sources
          tar -czf output/compiler-python.tar.gz -C .integration python platformio/platforms platformio/packages/toolchain-xtensa-esp32s3 platformio/packages/tool-esptoolpy platformio/packages/tool-scons
          tar -czf output/esp32s3-sdk.tar.gz -C .integration platformio/packages/framework-arduinoespressif32
          ls -lh output
          sha256sum output/* > output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: x4-integration-sources-${{ github.sha }}
          path: output/sources.tar.gz
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: x4-integration-compiler-${{ github.sha }}
          path: output/compiler-python.tar.gz
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: x4-integration-sdk-${{ github.sha }}
          path: output/esp32s3-sdk.tar.gz
          compression-level: 0
          if-no-files-found: error
