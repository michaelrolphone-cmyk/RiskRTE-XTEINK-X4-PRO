name: Qualify X4 panel 0.1.18

on:
  push:
    branches:
      - experiment/x4-panel-012-selective-nopof-018
    paths:
      - .github/workflows/qualify-x4-panel-018.yml

permissions:
  contents: write

env:
  PLATFORMIO_SETTING_ENABLE_TELEMETRY: "No"

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/x4-panel-012-selective-nopof-018
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: aaa77ad11fc66b42430254ab7065590d33fd1fca
          path: .shared/runtime
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/T5S3-Reader
          ref: 29276b4e1cff7819af065a77cf64805f6d5a12ce
          path: .shared/reader
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply selective differential powered-retention profile
        shell: bash
        run: |
          set -euo pipefail
          test "$(python3 -c 'import json; print(json.load(open("minimal/drivers/x4pro_uc8279_fast/manifest.json"))["version"])')" = '0.1.12'
          python3 minimal/scripts/apply_x4_panel_018.py
          python3 - <<'PY'
          from pathlib import Path
          readme = Path('minimal/drivers/x4pro_uc8279_fast/README.md')
          readme.write_text(readme.read_text().rstrip() + '\n')
          driver = Path('minimal/drivers/x4pro_uc8279_fast/driver.c')
          text = driver.read_text()
          old = '''                } else if (async_stage == UC_ASYNC_SYNC) {
                    settle_coverage_valid = false;
                    if (!fast_update) remember_completed_frame();
                    dtm1_synced = true;
'''
          new = '''                } else if (async_stage == UC_ASYNC_SYNC) {
                    /* Differential OLD synchronization must use the same PTIN
                     * window and RAM cursor as the NEW upload. Close PTIN only
                     * after DTM1 contains the physically completed target. */
                    if (fast_update) { command(0x92); if (io_failed) goto failed; }
                    settle_coverage_valid = false;
                    if (!fast_update) remember_completed_frame();
                    dtm1_synced = true;
'''
          if text.count(old) != 1:
              raise SystemExit('OLD-sync completion block not found exactly once')
          text = text.replace(old, new, 1)
          old = '''            if (fast_update) {
                command(0x92); if (io_failed) goto failed;
                remember_completed_frame();
'''
          new = '''            if (fast_update) {
                /* Absolute updates end PTIN here because they intentionally do
                 * not synchronize OLD. Differential updates retain PTIN until
                 * the matching DTM1 window has been copied. */
                if (absolute_update) { command(0x92); if (io_failed) goto failed; }
                remember_completed_frame();
'''
          if text.count(old) != 1:
              raise SystemExit('refresh-completion PTIN block not found exactly once')
          driver.write_text(text.replace(old, new, 1))
          PY
          rm minimal/scripts/apply_x4_panel_018.py \
             .github/workflows/qualify-x4-panel-018.yml
          git diff --check
          python3 -m json.tool minimal/drivers/x4pro_uc8279_fast/manifest.json >/dev/null
          python3 -m json.tool minimal/validation/uc8279-012-selective-nopof-0.1.18.json >/dev/null
          grep -q '#define X4PRO_ACTIVE_LOCAL_FRAMES 3u' minimal/drivers/x4pro_uc8279_fast/driver.c
          grep -q '#define X4PRO_ACTIVE_BROAD_FRAMES 2u' minimal/drivers/x4pro_uc8279_fast/driver.c
          grep -q 'absolute_update = false' minimal/drivers/x4pro_uc8279_fast/driver.c
          grep -q 'settle_stage = SETTLE_WAIT' minimal/drivers/x4pro_uc8279_fast/driver.c
          grep -q 'Differential OLD synchronization must use the same PTIN' minimal/drivers/x4pro_uc8279_fast/driver.c
          ! grep -q 'SETTLE_POF' minimal/drivers/x4pro_uc8279_fast/driver.c
          ! grep -q 'command(0x02)' minimal/drivers/x4pro_uc8279_fast/driver.c
          test "$(python3 -c 'import json; print(json.load(open("minimal/drivers/x4pro_uc8279_fast/manifest.json"))["version"])')" = '0.1.18'
          python3 minimal/test/uc8279_fast_profile_test.py

      - name: Run focused host qualification
        shell: bash
        env:
          RISCRTE_RUNTIME_ROOT: ${{ github.workspace }}/.shared/runtime
          RISCRTE_READER_ROOT: ${{ github.workspace }}/.shared/reader
        run: |
          set -euo pipefail
          for sanitize in 0 1; do
            build="$(mktemp -d)"
            python3 minimal/scripts/prepare_sdk.py \
              --runtime "$RISCRTE_RUNTIME_ROOT" \
              --reader "$RISCRTE_READER_ROOT" \
              --output "$build/sdk"
            flags=(-std=c11 -Wall -Wextra -Werror -Wno-misleading-indentation -pedantic)
            if [[ "$sanitize" == 1 ]]; then
              flags+=(-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -no-pie)
            fi
            cc "${flags[@]}" -I"$build/sdk" minimal/test/uc8279_fast_test.c -o "$build/test"
            for scenario in validation floating zero-probe unstable lut-bad claim-fail probe-spi-fail selective-nopof; do
              "$build/test" "$scenario"
            done
            rm -rf "$build"
          done

      - name: Commit exact qualified cohort
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(x4): add selective no-POF panel driver 0.1.18'
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          git push origin HEAD:experiment/x4-panel-012-selective-nopof-018

      - run: pip install platformio==6.1.19 pyelftools==0.32
      - name: Build Xtensa panel provider
        shell: bash
        run: |
          set -euo pipefail
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
          python3 minimal/scripts/build_drivers.py \
            --runtime .shared/runtime \
            --reader .shared/reader \
            --source-lock minimal/test/ordinary-driver-sources.lock.json \
            --cc "$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc" \
            --output build/x4-uc8279-fast-0.1.18 \
            --sleep \
            --panel-driver uc8279-fast
          printf '%s\n' '${{ steps.source.outputs.sha }}' > build/x4-uc8279-fast-0.1.18/platform-source-sha.txt
          sha256sum \
            minimal/drivers/x4pro_uc8279_fast/driver.c \
            minimal/drivers/x4pro_uc8279_fast/manifest.json \
            > build/x4-uc8279-fast-0.1.18/source-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: x4-uc8279-fast-0.1.18-${{ steps.source.outputs.sha }}
          path: build/x4-uc8279-fast-0.1.18/
          if-no-files-found: error
          retention-days: 14
