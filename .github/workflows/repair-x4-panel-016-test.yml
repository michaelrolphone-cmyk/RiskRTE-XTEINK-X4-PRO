name: Repair X4 panel 0.1.16 test fixture

on:
  push:
    branches:
      - recovery/x4-sd-state-0214-20261010
    paths:
      - .github/workflows/repair-x4-panel-016-test.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/x4-sd-state-0214-20261010
          fetch-depth: 0
      - name: Restore exact baseline fixture and apply 0.1.16 expectations
        shell: bash
        run: |
          set -euo pipefail
          python3 minimal/scripts/repair_x4_panel_016_test.py
          rm minimal/scripts/repair_x4_panel_016_test.py .github/workflows/repair-x4-panel-016-test.yml
          git diff --check
          grep -q 'nominal_refresh_millihz==9000' minimal/test/uc8279_fast_test.c
          grep -q 'fast_lut_frames==4' minimal/test/uc8279_fast_test.c
          grep -q 'fast_lut_frames==2u' minimal/test/uc8279_fast_test.c
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(x4): qualify longer absolute pulse expectations'
          git push origin HEAD:recovery/x4-sd-state-0214-20261010
