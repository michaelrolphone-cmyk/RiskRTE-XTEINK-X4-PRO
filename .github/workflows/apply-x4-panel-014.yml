name: Apply X4 UC8279 panel 0.1.14

on:
  push:
    branches:
      - recovery/x4-sd-state-0214-20261010
    paths:
      - .github/workflows/apply-x4-panel-014.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/x4-sd-state-0214-20261010
          fetch-depth: 0

      - name: Install complementary directional-overdrive driver
        shell: bash
        run: |
          set -euo pipefail
          cat .github/x4-panel-014-payload/part-* | tr -d '\n' | base64 -d > /tmp/x4-panel-014.patch.gz
          echo '37d111e9e44a51bccf94e46df558713e7914462b96c2441ef7f8926e31592ba3  /tmp/x4-panel-014.patch.gz' | sha256sum -c -
          gzip -dc /tmp/x4-panel-014.patch.gz > /tmp/x4-panel-014.patch
          git apply --index /tmp/x4-panel-014.patch
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/x4-fast-display.yml')
          text = path.read_text()
          replacements = {
              'minimal/validation/uc8279-delta-multipulse-0.1.13.json':
                  'minimal/validation/uc8279-complementary-directional-overdrive-0.1.14.json',
              '\"version\": \"0.1.13\"': '\"version\": \"0.1.14\"',
              "grep -q 'fast_lut_frames = 2u' minimal/drivers/x4pro_uc8279_fast/driver.c":
                  "grep -q 'write_directional_overdrive_lut_table' minimal/drivers/x4pro_uc8279_fast/driver.c",
              "grep -q 'changed_bounds' minimal/drivers/x4pro_uc8279_fast/driver.c":
                  "grep -q 'const bool old_first = fast_update && directional_overdrive' minimal/drivers/x4pro_uc8279_fast/driver.c\n          grep -q 'table\\[1\\] = high; table\\[2\\] = low' minimal/drivers/x4pro_uc8279_fast/driver.c",
              'build/x4-uc8279-fast-0.1.13': 'build/x4-uc8279-fast-0.1.14',
              'x4-uc8279-fast-0.1.13-${{ github.sha }}': 'x4-uc8279-fast-0.1.14-${{ github.sha }}',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected workflow text: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          python3 -m json.tool minimal/drivers/x4pro_uc8279_fast/manifest.json >/dev/null
          python3 -m json.tool minimal/validation/uc8279-complementary-directional-overdrive-0.1.14.json >/dev/null
          test "$(python3 -c 'import json; print(json.load(open("minimal/drivers/x4pro_uc8279_fast/manifest.json"))["version"])')" = '0.1.14'
          grep -q 'write_directional_overdrive_lut_table' minimal/drivers/x4pro_uc8279_fast/driver.c
          grep -q 'const bool old_first = fast_update && directional_overdrive' minimal/drivers/x4pro_uc8279_fast/driver.c
          grep -q 'table\[1\] = high; table\[2\] = low' minimal/drivers/x4pro_uc8279_fast/driver.c
          rm -rf .github/x4-panel-014-payload .github/x4-panel-014-payload.patch.gz .github/workflows/apply-x4-panel-014.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(x4): add complementary UC8279 directional overdrive'
          git push origin HEAD:recovery/x4-sd-state-0214-20261010
