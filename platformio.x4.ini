[env:xteink-x4-pro]
extends = base
board = t5s3-pro
lib_deps =
  ${base.lib_deps}
  https://github.com/m5stack/M5GFX.git#0.2.20
lib_ignore =
  Board_T5S3
  Board_EPD47
  bq25896
  bq27220
build_flags =
  ${base.build_flags}
  -DBOARD_XTEINK_X4_PRO
  -DRISCRTE_VERSION=\"${riscrte.version}\"
  -DCROSSPOINT_VERSION=\"${riscrte.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2

